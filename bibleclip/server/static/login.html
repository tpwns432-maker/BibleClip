<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BibleClip 로그인</title>
<style>
  :root {
    --bg: #faf9fc; --card: #ffffff; --text: #241d33; --muted: #6e6680;
    --line: #e4e0ec; --accent: #6d4dff; --err: #c0264b;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0b1a; --card: #1a1527; --text: #ece9f5; --muted: #a49cb8;
            --line: #2e2742; --accent: #8e7cff; --err: #ff7a95; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  form {
    width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 28px 24px;
  }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; font-weight: 700; font-size: 18px; }
  .logo b { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: #fff;
            display: grid; place-items: center; font-size: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: transparent; color: var(--text); font: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  button {
    width: 100%; margin-top: 22px; padding: 11px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  .err { color: var(--err); font-size: 13px; margin: 14px 0 0; }
</style>
</head>
<body>
<form method="post" action="login">
  <div class="logo"><b>B</b>BibleClip</div>
  <label for="id">아이디</label>
  <input id="id" name="id" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  <label for="pw">비밀번호</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required>
  <!--ERROR-->
  <button type="submit">로그인</button>
</form>
</body>
</html>
