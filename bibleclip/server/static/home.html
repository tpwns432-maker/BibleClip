<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BibleClip</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="_web/site.css">
<script src="js/theme.js"></script>
<script src="_web/site.js"></script>
</head>
<body class="site">
<header class="site-top">
  <a class="brand" href="./"><b>B</b><span>BibleClip</span></a>
  <span class="spacer"></span>
  <button class="btn ghost icon" id="theme-btn" type="button" title="테마" aria-label="테마">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a10 10 0 1 1 10-10c0 2.8-2.2 4-4.2 4H16a2 2 0 0 0-1.5 3.3c.5.6.3 2.7-2.5 2.7z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg>
  </button>
  <span class="who" id="who"></span>
  <button class="btn ghost" id="logout" type="button">로그아웃</button>
</header>

<main class="home">
  <p class="hello" id="hello">&nbsp;</p>
  <div class="tiles">
    <a class="tile" href="bible">
      <span class="tile-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M12 6v7M9 8.5h6"/></svg>
      </span>
      <b>성경</b>
      <small>읽기 · 검색 · 원어 · 나만 노트</small>
    </a>
    <a class="tile" href="community">
      <span class="tile-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg>
      </span>
      <b>커뮤니티</b>
      <small>말씀 · 모임 서적 · 묵상 나눔</small>
      <span class="badge" id="unread" hidden></span>
    </a>
  </div>

  <section class="recent" id="recent" hidden>
    <h2>최근 글</h2>
    <div class="recent-list" id="recent-list"></div>
  </section>

  <section class="account">
    <button class="link-btn" id="pw-open" type="button">비밀번호 바꾸기</button>
    <form class="form pw-form" id="pw-form" hidden>
      <label>지금 비밀번호<input type="password" name="current" autocomplete="current-password" required></label>
      <label>새 비밀번호(8자 이상)<input type="password" name="new" autocomplete="new-password" minlength="8" required></label>
      <label>새 비밀번호 한 번 더<input type="password" name="again" autocomplete="new-password" minlength="8" required></label>
      <p class="hint">바꾸면 다른 기기의 로그인은 풀립니다. 이 기기는 그대로입니다.</p>
      <p class="pw-msg" id="pw-msg" role="status"></p>
      <div class="form-acts"><button class="btn" type="button" id="pw-cancel">취소</button>
        <button class="btn primary" type="submit">바꾸기</button></div>
    </form>
  </section>
</main>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  $("logout").addEventListener("click", Site.logout);

  // 비밀번호 바꾸기(계정은 서버 주인이 만들고, 비밀번호는 각자 바꾼다).
  const pf = $("pw-form"), msg = $("pw-msg");
  $("pw-open").addEventListener("click", () => { pf.hidden = false; $("pw-open").hidden = true; pf.current.focus(); });
  $("pw-cancel").addEventListener("click", () => { pf.reset(); msg.textContent = ""; pf.hidden = true; $("pw-open").hidden = false; });
  pf.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (pf.new.value !== pf.again.value) { msg.textContent = "새 비밀번호 두 칸이 다릅니다."; return; }
    const r = await fetch("account/password", {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json", "X-BibleClip": "1" },
      body: JSON.stringify({ current: pf.current.value, new: pf.new.value }),
    });
    const b = await r.json().catch(() => ({}));
    msg.textContent = r.ok ? "바꿨습니다."
      : { wrong: "지금 비밀번호가 맞지 않습니다.", blocked: "여러 번 틀려서 잠시 막혔습니다. 15분 뒤에 해 주세요.",
          invalid: "새 비밀번호는 8자 이상이어야 합니다." }[b.error] || "바꾸지 못했습니다.";
    if (r.ok) { pf.reset(); setTimeout(() => $("pw-cancel").click(), 1500); }
  });
  Site.me().then((m) => {
    $("who").textContent = m.name;
    $("hello").textContent = "안녕하세요, " + m.name + "님";
    Site.themeMenu($("theme-btn"), m);
  }).catch(() => {});
  Site.capi("home").then((h) => {
    if (h.unread > 0) {
      $("unread").textContent = "새 글 " + h.unread;
      $("unread").hidden = false;
    }
    if (!h.recent.length) return;
    $("recent-list").innerHTML = h.recent.map((p) =>
      `<a class="recent-item" href="community#/p/${p.id}">` +
        `<span class="ri-title">${p.deleted ? "<i>지운 글입니다</i>" : Site.esc(p.title)}</span>` +
        `<span class="ri-meta">${Site.esc(p.topic.name)} · ${Site.esc(p.author.name)} · ${Site.timeTag(p.activity_at)}` +
        `${p.comments ? " · 댓글 " + p.comments : ""}` +
        `${p.is_new || p.new_comments ? ' <span class="new">새</span>' : ""}</span>` +
      `</a>`).join("");
    $("recent").hidden = false;
  }).catch(() => {});
})();
</script>
</body>
</html>
