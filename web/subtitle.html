<!DOCTYPE html>
<!--
  자막(PPT) 창 — v1.2.0. 빔프로젝터에 성경 구절만 띄우는 독립 윈도우.
  자체완결(self-contained): index.html 의 SPA 를 끌어오지 않고 pywebview 브리지와
  versebreak.js 만 쓴다(장바구니 팝아웃 cart.html 과 같은 방식).

  · 백엔드가 현재 슬라이드를 밀어준다 → window.renderSlide(payload)
  · 줄바꿈과 글자 크기는 **이 창이 직접** 정한다. 어디서 줄을 나눌지는 실제 렌더
    폭에 달렸고, 그건 이 창의 글꼴·크기·창 폭을 아는 여기서만 잴 수 있다.
  · 조작(다음/이전 슬라이드)은 노트북 쪽 창에서 한다 — 여기는 '보여주기만' 한다.
    다만 현장에서 자막 창에 포커스가 가 있는 경우가 있어 ←/→ 도 받아준다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자막</title>
<script src="js/versebreak.js"></script>
<style>
  /* 배색 프리셋. 투사 환경에서는 '대비'가 전부라 어느 조합이든 본문/배경 명도차를
     크게 잡는다. 기본은 연둣빛(사용자가 준 샘플 슬라이드 계열). */
  :root { --bg: #dfeae1; --fg: #1d4a2b; --ref: #3c6b48; }
  body[data-preset="navy"]  { --bg: #16233d; --fg: #e8eefc; --ref: #93a9d6; }
  body[data-preset="black"] { --bg: #000000; --fg: #ffffff; --ref: #b9b9b9; }
  body[data-preset="white"] { --bg: #ffffff; --fg: #16181d; --ref: #6a6a72; }
  /* 'theme' = 이 창이 뜬 OS 테마를 따른다(앱 테마와 결이 같도록 보라 계열 액센트). */
  body[data-preset="theme"] { --bg: #faf9fc; --fg: #241d33; --ref: #6d4dff; }
  @media (prefers-color-scheme: dark) {
    body[data-preset="theme"] { --bg: #0f0b1a; --fg: #ece9f5; --ref: #9a86ff; }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    /* --subtitle-font = 앱에서 고른 읽기 글꼴(있을 때만). 없으면 기본 스택. */
    font-family: var(--subtitle-font), 'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    /* 발표 화면에서 마우스 커서와 선택 하이라이트는 그 자체가 소음이다. */
    cursor: none; -webkit-user-select: none; user-select: none;
  }
  #stage { width: 100%; text-align: center; padding: 0 6vw; }
  #lines { font-weight: 700; letter-spacing: -.01em; }
  #lines div { white-space: pre; }      /* 줄바꿈은 우리가 정한다 — 브라우저 금지 */
  #ref { color: var(--ref); font-weight: 700; margin-top: 1.2em; }
  /* 여러 장짜리 본문일 때만 '2 / 5'. 청중에게 위치를 알려주는 최소한의 표시라
     작고 흐리게 — 발표 화면의 주인공은 성경 본문이다. */
  #page { color: var(--ref); font-size: 13px; opacity: .55; margin-top: .6em;
          letter-spacing: .08em; }
  #empty { color: var(--ref); font-size: 18px; font-weight: 600; opacity: .8; }
</style>
</head>
<body data-preset="green">
  <div id="stage">
    <div id="lines"></div>
    <div id="ref"></div>
    <div id="page"></div>
    <div id="empty">자막 대기 중 — 장바구니에 구절을 담거나 F9로 구절을 띄우세요</div>
  </div>

<script>
(function () {
  "use strict";
  var api = function () { return (window.pywebview && window.pywebview.api) || null; };
  var linesEl = document.getElementById("lines");
  var refEl = document.getElementById("ref");
  var emptyEl = document.getElementById("empty");
  var pageEl = document.getElementById("page");
  var stage = document.getElementById("stage");
  var current = null;          // 마지막으로 받은 슬라이드(창 크기 변경 시 다시 그림)

  // ---- 폭 측정 ----
  // Canvas 로 '실제 렌더 폭'을 잰다. DOM 에 붙였다 떼며 재면 매 후보마다 리플로가
  // 일어나 이분 탐색(수십 회) × DP(수백 회) 에서 눈에 띄게 느려진다.
  var cv = document.createElement("canvas");
  var ctx = cv.getContext("2d");
  function fontOf(size) {
    return "700 " + size + "px " + getComputedStyle(document.body).fontFamily;
  }
  function measureAt(text, size) {
    ctx.font = fontOf(size);
    return ctx.measureText(text).width;
  }

  var LINE_HEIGHT = 1.35;
  // 투사 화면에서 이보다 작으면 뒷자리에서 못 읽는다 — 여기 밑으로 내려갈 상황이면
  // 우겨넣지 말고 장을 넘긴다.
  var MIN_READABLE = 28;
  var reportedPages = 0;      // 백엔드에 마지막으로 알린 장수

  function draw() {
    if (!current || !current.ok || !current.verses || !current.verses.length) {
      linesEl.textContent = "";
      refEl.textContent = "";
      pageEl.textContent = "";
      emptyEl.style.display = "";
      return;
    }
    emptyEl.style.display = "none";

    // 들어가야 할 상자. #lines 의 clientWidth 가 곧 '글자가 쓸 수 있는 폭'이다
    // (#stage 의 좌우 6vw 패딩이 이미 빠진 값). 창이 아직 레이아웃 전이면 0 이 나오므로
    // 뷰포트 기준 근사치로 떨어진다. 높이는 참조 줄과 위아래 숨 쉴 공간을 남겨 74%.
    var maxWidth = linesEl.clientWidth || (window.innerWidth * 0.88);
    var maxHeight = window.innerHeight * 0.74;

    // 긴 본문은 여러 '장'으로 나뉜다. 몇 장인지는 여기서만 알 수 있으므로(글꼴·창
    // 크기에 달림) 백엔드에 보고해 ◀ ▶ 가 장 단위로 움직이게 한다.
    var pages = window.VerseBreak.paginate(current.verses, {
      measureAt: measureAt,
      maxWidth: maxWidth,
      maxHeight: maxHeight,
      lineHeight: LINE_HEIGHT,
      minSize: MIN_READABLE, min: 14, max: 160,
    });
    if (!pages.length) { emptyEl.style.display = ""; return; }

    // page = -1 은 '마지막 장'이라는 약속(◀ 로 앞 구절에 넘어온 경우).
    var want = (typeof current.page === "number") ? current.page : 0;
    var idx = want < 0 ? pages.length - 1
                       : Math.max(0, Math.min(want, pages.length - 1));
    var fitted = pages[idx];

    // 장수가 바뀌었으면 알린다(같은 값을 되풀이해 보내면 왕복만 는다).
    if (pages.length !== reportedPages) {
      reportedPages = pages.length;
      var a = api();
      if (a && a.report_slide_pages) { try { a.report_slide_pages(pages.length); } catch (e) {} }
    }
    pageEl.textContent = pages.length > 1 ? (idx + 1) + " / " + pages.length : "";

    linesEl.style.fontSize = fitted.size + "px";
    linesEl.style.lineHeight = LINE_HEIGHT;
    linesEl.innerHTML = "";
    fitted.lines.forEach(function (ln) {
      var d = document.createElement("div");
      d.textContent = ln;
      linesEl.appendChild(d);
    });
    // 참조 줄은 본문보다 확실히 작게(샘플 슬라이드도 그렇다).
    refEl.style.fontSize = Math.max(14, Math.round(fitted.size * 0.42)) + "px";
    refEl.textContent = current.ref || "";
  }

  // ---- 겉모습(배색 · 읽기 글꼴) ----
  // 이 창은 자체완결이라 메인 창이 주입해 둔 커스텀 글꼴을 물려받지 못한다. 그래서
  // 같은 브리지(get_font)로 base64 를 받아 여기서도 @font-face 를 심는다.
  var injected = {};      // family → true (같은 글꼴을 두 번 심지 않게)

  // 글꼴 이름은 파일명에서 오므로 CSS 를 깨뜨릴 문자가 섞일 수 있다. 막을 문자를
  // 나열하는 대신 **허용할 문자만** 남긴다 — 이스케이프 실수의 여지가 없다.
  function cssFontName(x) { return String(x).replace(/[^\w가-힣 .\-]/g, "").trim(); }

  window.applySubtitleStyle = function (st) {
    if (!st) return;
    document.body.setAttribute("data-preset", st.preset || "green");
    if (st.font_family && st.font_file) applyFont(st.font_family, st.font_file);
    else { document.body.style.removeProperty("--subtitle-font"); redraw(); }
  };

  function applyFont(family, file) {
    var name = cssFontName(family);
    var use = function () {
      document.body.style.setProperty("--subtitle-font", '"' + name + '"');
      // 글꼴이 바뀌면 글자 폭이 통째로 달라진다 → 줄바꿈을 다시 계산해야 한다.
      // (measure 가 getComputedStyle 을 읽으므로 적용 '후'에 다시 그려야 한다.)
      redraw();
    };
    if (injected[name]) { use(); return; }
    var a = api();
    if (!a || !a.get_font) return;
    a.get_font(file).then(function (info) {
      if (!info || !info.b64) return;
      var st = document.createElement("style");
      st.textContent = '@font-face{font-family:"' + name + '";font-display:swap;' +
        'src:url(data:' + info.mime + ';base64,' + info.b64 + ');}';
      document.head.appendChild(st);
      injected[name] = true;
      // 글리프가 실제로 로드된 뒤에 다시 그려야 폭 측정이 새 글꼴을 반영한다.
      if (document.fonts && document.fonts.load) {
        document.fonts.load('1em "' + name + '"').then(use, use);
      } else { use(); }
    }).catch(function () {});
  }

  function redraw() { reportedPages = 0; draw(); }

  // ---- 백엔드 → 이 창 ----
  window.renderSlide = function (payload) {
    var changed = !current || !payload ||
      current.ref !== payload.ref || current.index !== payload.index;
    current = payload;
    if (changed) reportedPages = 0;   // 새 본문 → 장수를 다시 세어 알린다
    draw();
  };

  // 창 크기가 바뀌면 줄바꿈이 통째로 달라진다 — 다시 계산해야 한다.
  // (이것이 줄바꿈을 미리 구워두지 않고 그리는 쪽에서 푸는 이유다.)
  var rt = null;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () { reportedPages = 0; draw(); }, 80);
  });

  // 현장에서 이 창에 포커스가 가 있는 경우가 있어 최소한의 조작은 받아준다.
  document.addEventListener("keydown", function (e) {
    var a = api();
    if (!a) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); a.slide_step(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); a.slide_step(-1); }
  });

  function boot() {
    var a = api();
    if (!a) return;
    a.get_subtitle_style().then(window.applySubtitleStyle).catch(function () {});
    a.get_slide().then(window.renderSlide).catch(function () {});
  }
  if (window.pywebview && window.pywebview.api) boot();
  else window.addEventListener("pywebviewready", boot);
})();
</script>
</body>
</html>
