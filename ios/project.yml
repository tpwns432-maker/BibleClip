# XcodeGen spec — CI turns this into BibleClip.xcodeproj (docs/IOS_PLAN.md).
# There is no Mac in this project, so never hand-edit an .xcodeproj; change this file.
name: BibleClip
options:
  bundleIdPrefix: com.bibleclip
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BibleClip:
    type: application
    platform: iOS
    sources:
      - BibleClip
    settings:
      base:
        # Fixed for good: a different bundle id is a different app with its own data.
        PRODUCT_BUNDLE_IDENTIFIER: com.bibleclip.app.sejun
        PRODUCT_NAME: BibleClip
        INFOPLIST_KEY_CFBundleDisplayName: BibleClip
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # Built unsigned in CI; Sideloadly/AltStore signs it with the user's Apple ID.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
